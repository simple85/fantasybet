[project]
name = "fantasybet-integrity"
version = "0.1.0"
description = "Betting-integrity detection for FantasyBet: features, rules and an anomaly model"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "psycopg[binary]>=3.2",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["integrity"]
