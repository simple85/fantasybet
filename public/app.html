    function translateLiveBetName(name, fallback) {
      const lang = getCurrentLang();
      if (LIVE_BET_NAMES[lang]?.[name]) return LIVE_BET_NAMES[lang][name];
      // If fallback is explicitly false, return null (used by translateSelection to try betName() next)
      return fallback === false ? null : name;
    }

    // ── SORT BET VALUES LOGICALLY ──
    function sortBetValues(values, betId) {
      const sorted = [...values];

      // Handicap bets (4, 19, 51, 86) — sort by line ascending, Home before Draw before Away
      if ([4, 19, 51, 86].includes(betId)) {
        const sideOrder = { "Home": 0, "Draw": 1, "Away": 2 };
        return sorted.sort((a, b) => {
          const parseH = (v) => {
            const s = String(v);
            const m = s.match(/^(Home|Draw|Away)\s+([+-]?\d+\.?\d*)$/);
            if (!m) return { side: 99, line: 0 };
            return { side: sideOrder[m[1]] ?? 99, line: parseFloat(m[2]) };
          };
          const pa = parseH(a.value), pb = parseH(b.value);
          if (pa.line !== pb.line) return pa.line - pb.line;
          return pa.side - pb.side;
        });
      }

      // Score bets (10: Exact Score, 31: Correct Score 1st Half)
      // Sort: 0:0, 0:1, 0:2... 1:0, 1:1, 1:2... by total goals, then home goals
      if ([10, 31].includes(betId)) {
        return sorted.sort((a, b) => {
          const [ah, aa] = String(a.value).split(":").map(Number);
          const [bh, ba] = String(b.value).split(":").map(Number);
          const aTotal = ah + aa, bTotal = bh + ba;
          if (aTotal !== bTotal) return aTotal - bTotal;
          if (ah !== bh) return ah - bh;
          return aa - ba;
        });
      }

      // Over/Under bets — group by line, Over before Under
      // Bet IDs: 5, 6, 72, 45, 77, 87(Total ShotOnGoal)
      if ([5, 6, 72, 45, 77, 87].includes(betId)) {
        return sorted.sort((a, b) => {
          const parseOU = (v) => {
            const s = String(v);
            const m = s.match(/^(Over|Under|Exactly)\s+(.+)$/);
            if (!m) return { num: 0, type: 0 };
            const num = parseFloat(m[2]);
            const type = m[1] === "Over" ? 0 : m[1] === "Under" ? 1 : 2;
            return { num, type };
          };
          const pa = parseOU(a.value), pb = parseOU(b.value);
          if (pa.num !== pb.num) return pa.num - pb.num;
          return pa.type - pb.type;
        });
      }

      // Corners 3-way (85) — Under, Exactly, Over
      if (betId === 85) {
        return sorted.sort((a, b) => {
          const parseC = (v) => {
            const s = String(v);
            const m = s.match(/^(Over|Under|Exactly)\s+(.+)$/);
            if (!m) return { num: 0, type: 1 };
            const num = parseFloat(m[2]);
            const type = m[1] === "Under" ? 0 : m[1] === "Exactly" ? 1 : 2;
            return { num, type };
          };
          const pa = parseC(a.value), pb = parseC(b.value);
          if (pa.num !== pb.num) return pa.num - pb.num;
          return pa.type - pb.type;
        });
      }

      // HT/FT (7) — logical order: H/H, H/D, H/A, D/H, D/D, D/A, A/H, A/D, A/A
      if (betId === 7) {
        const htftOrder = {
          "Home/Home": 0, "Home/Draw": 1, "Home/Away": 2,
          "Draw/Home": 3, "Draw/Draw": 4, "Draw/Away": 5,
          "Away/Home": 6, "Away/Draw": 7, "Away/Away": 8
        };
        return sorted.sort((a, b) => (htftOrder[a.value] ?? 99) - (htftOrder[b.value] ?? 99));
      }

      // Match Winner / Result bets — Home, Draw, Away
      if ([1, 2, 3, 13].includes(betId)) {
        const resultOrder = { "Home": 0, "Draw": 1, "Away": 2 };
        return sorted.sort((a, b) => (resultOrder[a.value] ?? 99) - (resultOrder[b.value] ?? 99));
      }

      // Double Chance (12, 20) — Home/Draw, Home/Away, Draw/Away
      if ([12, 20].includes(betId)) {
        const dcOrder = { "Home/Draw": 0, "Home/Away": 1, "Draw/Away": 2 };
        return sorted.sort((a, b) => (dcOrder[a.value] ?? 99) - (dcOrder[b.value] ?? 99));
      }

      // Odd/Even (21, 22, 52, 53, 63) — Odd first
      if ([21, 22, 52, 53, 63].includes(betId)) {
        const oeOrder = { "Odd": 0, "Even": 1 };
        return sorted.sort((a, b) => (oeOrder[a.value] ?? 99) - (oeOrder[b.value] ?? 99));
      }

      // Both Teams Score (8, 25, 26) — Yes, No
      if ([8, 25, 26].includes(betId)) {
        const ynOrder = { "Yes": 0, "No": 1 };
        return sorted.sort((a, b) => (ynOrder[a.value] ?? 99) - (ynOrder[b.value] ?? 99));
      }

      // Team to Score First/Last (14, 15) — Home, Draw (No Goal), Away
      if ([14, 15].includes(betId)) {
        const tsOrder = { "Home": 0, "Draw": 1, "No Goal": 1, "Away": 2 };
        return sorted.sort((a, b) => (tsOrder[a.value] ?? 99) - (tsOrder[b.value] ?? 99));
      }

      // Total Goals Exact (16) — by number
      if (betId === 16) {
        return sorted.sort((a, b) => {
          const na = parseFloat(String(a.value).replace(/[^0-9.]/g, "")) || 0;
          const nb = parseFloat(String(b.value).replace(/[^0-9.]/g, "")) || 0;
          return na - nb;
        });
      }

      // Home/Away total goals (17, 18), Cards O/U (43), Home/Away cards (44, 46),
      // Home/Away corners (47, 48), Corners 1st half (49)
      if ([17, 18, 43, 44, 46, 47, 48, 49].includes(betId)) {
        return sorted.sort((a, b) => {
          const parseOU = (v) => {
            const s = String(v);
            const m = s.match(/^(Over|Under)\s+(.+)$/);
            if (!m) return { num: 0, type: 0 };
            return { num: parseFloat(m[2]), type: m[1] === "Over" ? 0 : 1 };
          };
          const pa = parseOU(a.value), pb = parseOU(b.value);
          if (pa.num !== pb.num) return pa.num - pb.num;
          return pa.type - pb.type;
        });
      }

      // Player bets (34-40) — sort by odds ascending (best value first)
      if ([34, 35, 36, 37, 38, 39, 40].includes(betId)) {
        return sorted.sort((a, b) => parseFloat(a.odd) - parseFloat(b.odd));
      }

      return sorted;
    }

    // ── SORT LIVE BET VALUES (by value pattern + handicap field, not by ID) ──
    function sortLiveBetValues(values, betName) {
      const sorted = [...values];
      if (sorted.length <= 1) return sorted;

      // Detect value patterns — values are now combined ("Over 2.5", "Home 3") so extract base keyword
      const hasHandicap = sorted.some(v => v.handicap != null && v.handicap !== "" && v.handicap !== "null");
      const baseVal = v => String(v.value).replace(/\s+[-+]?\d[\d.]*$/, ""); // "Over 2.5" → "Over", "Home 3" → "Home"
      const baseSet = new Set(sorted.map(v => baseVal(v)));

      // ── Over/Under with handicap lines (Match Goals, Corners O/U, etc.) ──
      if (hasHandicap && (baseSet.has("Over") || baseSet.has("Under"))) {
        const typeOrder = { "Over": 0, "Under": 1, "Exactly": 2 };
        return sorted.sort((a, b) => {
          const ha = parseFloat(a.handicap) || 0;
          const hb = parseFloat(b.handicap) || 0;
          if (ha !== hb) return ha - hb;
          return (typeOrder[baseVal(a)] ?? 99) - (typeOrder[baseVal(b)] ?? 99);
        });
      }

      // ── Handicap with Home/Draw/Away + handicap lines (3-Way Handicap, Asian Handicap) ──
      if (hasHandicap && (baseSet.has("Home") || baseSet.has("Away"))) {
        const sideOrder = { "Home": 0, "Draw": 1, "Away": 2 };
        return sorted.sort((a, b) => {
          const ha = parseFloat(a.handicap) || 0;
          const hb = parseFloat(b.handicap) || 0;
          if (ha !== hb) return ha - hb;
          return (sideOrder[baseVal(a)] ?? 99) - (sideOrder[baseVal(b)] ?? 99);
        });
      }

      // ── Home/Draw/Away without handicap (1x2, To Win 2nd Half, etc.) ──
      if (baseSet.has("Home") && baseSet.has("Away")) {
        const order = { "Home": 0, "Draw": 1, "Away": 2 };
        return sorted.sort((a, b) => (order[baseVal(a)] ?? 99) - (order[baseVal(b)] ?? 99));
      }

      // ── Double Chance (Home or Draw, etc.) ──
      if (baseSet.has("Home or Draw")) {
        const order = { "Home or Draw": 0, "Home or Away": 1, "Draw or Away": 2, "Away or Draw": 2 };
        return sorted.sort((a, b) => (order[a.value] ?? 99) - (order[b.value] ?? 99));
      }

      // ── Yes/No (BTS etc.) ──
      if (baseSet.has("Yes") && baseSet.has("No")) {
        return sorted.sort((a, b) => (a.value === "Yes" ? 0 : 1) - (b.value === "Yes" ? 0 : 1));
      }

      // ── Compound Home/Yes, Away/No etc. (Result/BTS) ──
      if (sorted.some(v => v.value.includes("/"))) {
        const compOrder = { "Home/Yes": 0, "Home/No": 1, "Draw/Yes": 2, "Draw/No": 3, "Away/Yes": 4, "Away/No": 5 };
        return sorted.sort((a, b) => (compOrder[a.value] ?? 99) - (compOrder[b.value] ?? 99));
      }

      return sorted;
    }

    // ── RENDER A SINGLE BET BLOCK ──
    function renderBetBlock(bet, match, mid, disabled, isLive) {
      const values = isLive ? sortLiveBetValues(bet.values, bet.name) : sortBetValues(bet.values, bet.id);
      const homeName = match.home.name;
      const awayName = match.away.name;
      const isPlayerBet = !isLive && [34, 35, 36, 37, 38, 39, 40].includes(bet.id);
      const isScoreBet = !isLive && [10, 31].includes(bet.id);
      const disAttr = disabled ? ' disabled' : '';
      const disClass = disabled ? ' disabled' : '';

      // Live bets: use API name (translated). Pre-match: use our betName() lookup.
      const translatedName = isLive ? translateLiveBetName(bet.name) : betName(bet.id, bet.name);
      let html = '<div class="market-block"><div class="market-block-title">' + translatedName + '</div>';

      if (isPlayerBet) {
        // Player market: grid of player buttons
        html += '<div class="player-odds-grid">';
        values.forEach(v => {
          const sel = !disabled && isSelected(mid, bet.id, v.value) ? "selected" : "";
          const oddKey = mid + "-" + bet.id + "-" + v.value;
          const suspClass = v.suspended ? " suspended" : "";
          html += '<button class="player-odd-btn ' + sel + disClass + suspClass + '"' + disAttr + ' onclick="toggleOdd(' + mid + ',' + bet.id + ',\'' + esc(v.value) + '\',' + v.odd + ',\'' + esc(bet.name) + '\')">' +
            '<span class="pname">' + v.value + '</span>' +
            '<span class="pvalue odd-value" data-odd-key="' + esc(oddKey) + '">' + parseFloat(v.odd).toFixed(2) + '</span>' +
          '</button>';
        });
        html += '</div>';
      } else if (isScoreBet) {
        // Score grid
        html += '<div class="score-grid">';
        values.forEach(v => {
          const sel = !disabled && isSelected(mid, bet.id, v.value) ? "selected" : "";
          const oddKey = mid + "-" + bet.id + "-" + v.value;
          const suspClass = v.suspended ? " suspended" : "";
          html += '<button class="odd-btn ' + sel + disClass + suspClass + '"' + disAttr + ' onclick="toggleOdd(' + mid + ',' + bet.id + ',\'' + esc(v.value) + '\',' + v.odd + ',\'' + esc(bet.name) + '\')">' +
            '<span class="label">' + String(v.value) + '</span>' +
            '<span class="value odd-value" data-odd-key="' + esc(oddKey) + '">' + parseFloat(v.odd).toFixed(2) + '</span>' +
          '</button>';
        });
        html += '</div>';
      } else {
        // Standard odds grid
        // For live bets: detect if "1"/"2" values mean team selection (vs goal counts)
        const isTeamSelectBet = isLive && /which team|race to|last corner/i.test(bet.name);
        html += '<div class="odds-grid">';
        values.forEach(v => {
          // Translate and replace Home/Away with team names
          let label = translateLabel(v.value, homeName, awayName, bet.id, isLive);
          // For team-selection bets, "1" = home team, "2" = away team
          if (isTeamSelectBet) {
            if (v.value === "1") label = homeName;
            else if (v.value === "2") label = awayName;
          }
          // Shorten long labels
          if (label.length > 20) label = label.replace(homeName, shortName(homeName)).replace(awayName, shortName(awayName));

          const sel = !disabled && isSelected(mid, bet.id, v.value) ? "selected" : "";
          const oddKey = mid + "-" + bet.id + "-" + v.value;
          const suspClass = v.suspended ? " suspended" : "";
          html += '<button class="odd-btn ' + sel + disClass + suspClass + '"' + disAttr + ' onclick="toggleOdd(' + mid + ',' + bet.id + ',\'' + esc(v.value) + '\',' + v.odd + ',\'' + esc(bet.name) + '\')">' +
            '<span class="label">' + label + '</span>' +
            '<span class="value odd-value" data-odd-key="' + esc(oddKey) + '">' + parseFloat(v.odd).toFixed(2) + '</span>' +
          '</button>';
        });
        html += '</div>';
      }

      html += '</div>';
      return html;
    }

    // ── ODD BUTTON HELPER ──
    function oddBtn(matchId, betId, pick, label, value, fullName, disabled, suspended) {
      if (!value) return '';
      const isDisabled = disabled || suspended;
      const sel = !isDisabled && isSelected(matchId, betId, pick) ? "selected" : "";
      const disAttr = isDisabled ? ' disabled' : '';
      const disClass = isDisabled ? ' disabled' : '';
      const suspClass = suspended ? ' suspended' : '';
      const oddKey = matchId + "-" + betId + "-" + pick;
      return '<button class="odd-btn ' + sel + disClass + suspClass + '"' + disAttr + ' onclick="toggleOdd(' + matchId + ',' + betId + ',\'' + esc(pick) + '\',' + value + ',\'' + esc(fullName || label) + '\')">' +
        '<span class="label">' + label + '</span>' +
        '<span class="value odd-value" data-odd-key="' + esc(oddKey) + '">' + parseFloat(value).toFixed(2) + '</span>' +
      '</button>';
    }

    function esc(str) { return String(str == null ? '' : str).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
    function shortName(name) { return name?.split(' ').pop() || name; }

    // ── Translate common bet value labels ──
    function translateLabel(val, homeName, awayName, betId, isLive) {
      let s = String(val);
      // Handicap bets and ALL live bets use translated words (İç Saha / Deplasman) instead of team names
      const useTranslatedHomeAway = isLive || [4, 19, 51, 86].includes(betId);
      // Exact keyword matches
      const keywords = {
        "Home": useTranslatedHomeAway ? t("home") : (homeName || t("home")),
        "Away": useTranslatedHomeAway ? t("away") : (awayName || t("away")),
        "Draw": t("draw"),
        "Yes": t("yes"),
        "No": t("no"),
        "Odd": t("odd") || "Tek",
        "Even": t("even") || "Çift",
        "Over": t("over"),
        "Under": t("under"),
        "Exactly": t("exactly") || "Tam",
        "No goal": t("noGoal") || "Gol Yok",
        "Neither": t("neither") || "Hiçbiri",
        "3 or more": "3+",
        "Home or Draw": (useTranslatedHomeAway ? t("home") : homeName) + "/" + t("draw"),
        "Away or Draw": (useTranslatedHomeAway ? t("away") : awayName) + "/" + t("draw"),
        "Home or Away": (useTranslatedHomeAway ? t("home") : homeName) + "/" + (useTranslatedHomeAway ? t("away") : awayName),
      };
      // Handle compound formats like "Home/Draw", "Away/Away", "Draw/Home"
      if (s.includes("/")) {
        const parts = s.split("/");
        return parts.map(p => {
          const trimmed = p.trim();
          return keywords[trimmed] !== undefined ? keywords[trimmed] : trimmed;
        }).join("/");
      }
      // Handle "Over X.X" / "Under X.X" (pre-match or live combined value)
      const ouMatch = s.match(/^(Over|Under)\s+(.+)$/);
      if (ouMatch) {
        return keywords[ouMatch[1]] + " " + ouMatch[2];
      }
      // Handle "Home N" / "Away N" / "Draw N" (live combined handicap values)
      const hcMatch = s.match(/^(Home|Away|Draw)\s+([-+]?\d[\d.]*)$/);
      if (hcMatch) {
        const translated = keywords[hcMatch[1]] || hcMatch[1];
        const hcNum = parseFloat(hcMatch[2]);
        const hcStr = hcNum > 0 ? "+" + hcMatch[2] : hcMatch[2];
        return translated + " " + hcStr;
      }
      // Handle "Exactly N"
      const exactMatch = s.match(/^Exactly\s+(.+)$/);
      if (exactMatch) {
        return (keywords["Exactly"] || "Exactly") + " " + exactMatch[1];
      }
      // Direct keyword match
      if (keywords[s] !== undefined) return keywords[s];
      return s;
    }

    // ── EXPAND / TABS ──
    function toggleExpand(mid) {
      const el = document.getElementById("expanded-" + mid);
      if (!el) return;
      const btn = el.previousElementSibling;

      // Lazy-load: build expanded markets HTML on first open
      if (!el.dataset.loaded) {
        const match = matches.find(m => m.id == mid);
        if (match) {
          const statusClass = getStatusClass(match.status || "Not Started", match.date);
          const isLive = statusClass === "live";
          const bettingDisabled = statusClass === "finished";
          const liveData = liveOddsMap[mid];
          const bets = isLive ? (liveData && liveData.odds ? liveData.odds : []) : (match.bets || []);
          el.innerHTML = buildExpandedMarkets(match, bets, mid, bettingDisabled, isLive);
          el.dataset.loaded = "1";
          syncOddButtons();
        }
      }

      el.classList.toggle("show");
      btn?.classList.toggle("open");
      const label = document.getElementById("expandLabel-" + mid);
      if (label) label.textContent = el.classList.contains("show") ? tm("lessMarkets") : tm("moreMarkets");
    }

    function switchMarketTab(mid, tabId) {
      const card = document.getElementById("card-" + mid);
      if (!card) return;
      card.querySelectorAll(".market-tab").forEach(t => t.classList.remove("active"));
      card.querySelectorAll(".market-panel").forEach(p => p.classList.remove("show"));
      event.target.classList.add("active");
      const panel = document.getElementById("panel-" + mid + "-" + tabId);
      if (panel) panel.classList.add("show");
    }

    // ── BET SLIP ──
    // Translate a stored selection for display (betslip sidebar + My Bets)
    function translateSelection(sel) {
      const match = matches.find(m => m.id === sel.matchId);
      const homeName = match ? match.home.name : "";
      const awayName = match ? match.away.name : "";
      // Translate market name (try live name table first, fall back to betName lookup)
      const mkt = translateLiveBetName(sel.marketLabel, false) ||
                  betName(sel.betId, sel.marketLabel);
      // Translate pick label (Over 2.5 → Üst 2.5, Home → İç Saha, etc.)
      const pickT = translateLabel(sel.pick, homeName, awayName, sel.betId, true);
      return mkt + ': ' + pickT;
    }

    function isSelected(matchId, betId, pick) {
      return betSlip.some(s => s.matchId === matchId && s.betId === betId && s.pick === pick);
    }

    // Lightweight: sync .selected class on all odd buttons without rebuilding DOM
    function syncOddButtons() {
      const selectedKeys = new Set();
      betSlip.forEach(s => selectedKeys.add(s.matchId + "-" + s.betId + "-" + s.pick));
      document.querySelectorAll('.odd-btn, .player-odd-btn').forEach(btn => {
        const keyEl = btn.querySelector('[data-odd-key]');
        if (!keyEl) return;
        const key = keyEl.getAttribute('data-odd-key');
        btn.classList.toggle('selected', selectedKeys.has(key));
      });
    }

    function toggleOdd(matchId, betId, pick, value, betName) {
      const match = matches.find(m => m.id === matchId);
      const existingIdx = betSlip.findIndex(s => s.matchId === matchId && s.betId === betId);

      if (existingIdx > -1) {
        if (betSlip[existingIdx].pick === pick) {
          betSlip.splice(existingIdx, 1);
        } else {
          betSlip[existingIdx].pick = pick;
          betSlip[existingIdx].odd = parseFloat(value);
          betSlip[existingIdx].pickLabel = pick;
        }
      } else {
        betSlip.push({
          matchId,
          matchLabel: match.home.name + " - " + match.away.name,
          betId,
          marketLabel: betName || ("Bet " + betId),
          pick,
          pickLabel: pick,
          odd: parseFloat(value)
        });
        // Auto-switch to system if multiple bets from the same match
        if (betSlipMode === "combined" && hasSameMatchDuplicates()) {
          setBetSlipMode("system");
        }
      }

      renderBetSlip();
      syncOddButtons();
    }

    // Check if betslip has multiple selections from the same match
    function hasSameMatchDuplicates() {
      const matchIds = betSlip.map(s => s.matchId);
      return new Set(matchIds).size < matchIds.length;
    }

    function renderBetSlip() {
      const count = betSlip.length;
      const sidebar = document.getElementById("betslipSidebar");
      const countEl = document.getElementById("slipCount");
      countEl.textContent = count;
      countEl.classList.toggle("empty", count === 0);
      const wasEmpty = !sidebar.classList.contains("has-bets");
      sidebar.classList.toggle("has-bets", count > 0);
      document.getElementById("betslipEmpty").style.display = count === 0 ? "flex" : "none";
      document.getElementById("betslipFooter").style.display = count > 0 ? "block" : "none";
      // Show mode toggle when there are 2+ selections
      const modeToggle = document.getElementById("betslipModeToggle");
      modeToggle.style.display = count >= 2 ? "flex" : "none";
      document.getElementById("modeCombined").textContent = t("combined");
      document.getElementById("modeSystem").textContent = t("system");
      // Reset to combined if only 1 selection or no same-match duplicates remain
      if (betSlipMode === "system" && (count < 2 || !hasSameMatchDuplicates())) setBetSlipMode("combined");
      if (count === 0) sidebar.classList.remove("open");
      // Auto-expand on first bet only
      if (count === 1 && wasEmpty) sidebar.classList.add("open");
      document.getElementById("betslipItems").innerHTML = betSlip.map((s, i) => {
        // Check if this match is live — show indicator
        const match = matches.find(m => m.id === s.matchId);
        const isLive = match && (getStatusClass(match.status || "Not Started", match.date) === "live" || getStatusClass(match.status || "Not Started", match.date) === "starting");
        const liveTag = isLive ? '<span style="color:var(--red);font-size:0.6rem;font-weight:700;margin-left:0.3rem;">LIVE</span>' : '';
        return '<div class="slip-item">' +
          '<button class="slip-item-remove" onclick="removeFromSlip(' + i + ')">X</button>' +
          '<div class="slip-item-match">' + s.matchLabel + liveTag + '</div>' +
          '<div class="slip-item-pick">' +
            '<span class="selection">' + translateSelection(s) + '</span>' +
            '<span class="odd">' + s.odd.toFixed(2) + '</span>' +
          '</div>' +
        '</div>';
      }).join("");
      updateSlipSummary();
    }

    function removeFromSlip(i) { betSlip.splice(i, 1); renderBetSlip(); syncOddButtons(); }
    function clearSlip() { betSlip = []; document.getElementById("stakeInput").value = ""; renderBetSlip(); syncOddButtons(); }
    function setStake(a) { document.getElementById("stakeInput").value = a; updateSlipSummary(); }

    function setBetSlipMode(mode) {
      if (mode === "combined" && hasSameMatchDuplicates()) {
        showToast(t("sameMatchCombinedError"), "error");
        return;
      }
      betSlipMode = mode;
      document.getElementById("modeCombined").classList.toggle("active", mode === "combined");
      document.getElementById("modeSystem").classList.toggle("active", mode === "system");
      updateSlipSummary();
    }

    function updateSlipSummary() {
      if (betSlip.length === 0) return;
      const stake = parseFloat(document.getElementById("stakeInput").value) || 0;
      const btn = document.getElementById("placeBetBtn");
      const credits = currentUser?.credits || 0;
      const totalCost = betSlipMode === "system" ? stake * betSlip.length : stake;
      const validStake = stake >= MIN_BET;
      const canAfford = totalCost <= credits;
      btn.disabled = !validStake || !canAfford;
      btn.style.opacity = (validStake && canAfford) ? "1" : "0.4";

      if (validStake && !canAfford) {
        showStackToast(t("insufficientCredits"), "error");
      }

      if (betSlipMode === "system") {
        // System: each selection is independent, stake per bet
        const count = betSlip.length;
        // Max possible win = sum of each individual bet's win
        const maxWin = betSlip.reduce((sum, s) => sum + stake * s.odd, 0);
        document.getElementById("totalOddsLabel").textContent = t("perBetStake");
        document.getElementById("totalOddsValue").textContent = stake.toFixed(2) + " €";
        document.getElementById("possibleWinLabel").textContent = t("possibleWin");
        document.getElementById("possibleWinValue").textContent = maxWin.toFixed(2) + " €";
        // Update place bet button to show total cost
        btn.textContent = t("placeBet").toUpperCase() + (validStake ? " (" + totalCost.toFixed(2) + " €)" : "");
      } else {
        // Combined: multiply all odds
        const totalOdds = betSlip.reduce((a, s) => a * s.odd, 1);
        document.getElementById("totalOddsLabel").textContent = t("totalOdds");
        document.getElementById("totalOddsValue").textContent = totalOdds.toFixed(2);
        document.getElementById("possibleWinLabel").textContent = t("possibleWin");
        document.getElementById("possibleWinValue").textContent = (stake * totalOdds).toFixed(2) + " €";
        btn.textContent = t("placeBet").toUpperCase();
      }
    }

    function translateServerError(err) {
      if (!err) return t("insufficientCredits");
      if (err.includes("suspended")) return t("oddsSuspended");
      if (err.includes("finished")) return t("matchFinished");
      if (err.includes("Insufficient")) return t("insufficientCredits");
      return err;
    }

    async function placeBet() {
      const stake = parseFloat(document.getElementById("stakeInput").value) || 0;
      // Refresh credits from server
      try {
        const res = await fetch("/api/users/" + currentUser.id);
        if (res.ok) {
          const fresh = await res.json();
          currentUser.credits = fresh.credits;
        }
      } catch (e) {}

      const credits = currentUser.credits || 0;
      if (stake < MIN_BET) { showToast(t("minBetError") + MIN_BET, "error"); return; }
      if (stake > MAX_BET) { showToast(t("maxBetError") + MAX_BET.toLocaleString(), "error"); return; }

      if (betSlipMode === "system") {
        // System: single bet, each selection independent. Total cost = stake × count.
        const totalCost = stake * betSlip.length;
        if (totalCost > credits) { showToast(t("insufficientCredits"), "error"); return; }
        const maxWin = betSlip.reduce((sum, s) => sum + stake * s.odd, 0);
        try {
          const res = await fetch("/api/bets", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              userId: currentUser.id,
              selections: [...betSlip],
              stake,
              totalOdds: 0,
              possibleWin: maxWin,
              mode: "system",
            })
          });
          const data = await res.json();
          if (data.success) {
            currentUser.credits = data.credits;
            localStorage.setItem("betzone_user", JSON.stringify(currentUser));
            clearSlip();
            updateUI();
            showToast(t("betPlaced") + " (" + t("system") + ")", "success");
          } else {
            showToast(translateServerError(data.error), "error");
            if (data.error && (data.error.includes("suspended") || data.error.includes("finished"))) {
              removeBadSelections();
            }
          }
        } catch (e) {
          showToast("Connection error", "error");
        }
      } else {
        // Combined: single bet with all selections
        if (stake > credits) { showToast(t("insufficientCredits"), "error"); return; }
        const totalOdds = betSlip.reduce((a, s) => a * s.odd, 1);
        try {
          const res = await fetch("/api/bets", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              userId: currentUser.id,
              selections: [...betSlip],
              stake,
              totalOdds,
              possibleWin: stake * totalOdds,
              mode: "combined",
            })
          });
          const data = await res.json();
          if (data.success) {
            currentUser.credits = data.credits;
            localStorage.setItem("betzone_user", JSON.stringify(currentUser));
            clearSlip();
            updateUI();
            showToast(t("betPlaced"), "success");
          } else {
            showToast(translateServerError(data.error), "error");
            if (data.error && (data.error.includes("suspended") || data.error.includes("finished"))) {
              removeBadSelections();
            }
          }
        } catch (e) {
          showToast("Connection error", "error");
        }
      }
    }

    // Remove suspended/finished selections from betslip after server rejection
    function removeBadSelections() {
      const before = betSlip.length;
      betSlip = betSlip.filter(s => {
        const match = matches.find(m => m.id === s.matchId);
        if (!match) return false;
        const sc = getStatusClass(match.status || "Not Started", match.date);
        if (sc === "finished") return false;
        // Check live odds for suspension
        const liveItem = liveOddsMap[s.matchId];
        if (liveItem && liveItem.odds) {
          const liveBet = liveItem.odds.find(b => b.id === s.betId);
          const liveVal = liveBet && (liveBet.values || []).find(v => v.value === s.pick);
          if (!liveVal || liveVal.suspended) return false;
        }
        return true;
      });
      if (betSlip.length < before) {
        renderBetSlip();
        syncOddButtons();
      }
    }

    // ── MY BETS ──
    async function renderMyBets() {
      let bets = [];
      try {
        const res = await fetch("/api/bets/" + currentUser.id);
        if (res.ok) bets = await res.json();
      } catch (e) {}

      // Also refresh credits (settlement may have changed them)
      try {
        const res = await fetch("/api/users/" + currentUser.id);
        if (res.ok) {
          const fresh = await res.json();
          currentUser.credits = fresh.credits;
          localStorage.setItem("betzone_user", JSON.stringify(currentUser));
          document.getElementById("creditsAmount").textContent = (currentUser.credits || 0).toLocaleString() + " €";
        }
      } catch (e) {}

      const active = bets.filter(b => b.status === "pending");
      const settled = bets.filter(b => b.status !== "pending");

      const renderBet = (bet) => {
        const dt = new Date(bet.timestamp);
        const statusLabel = t(bet.status);
        const isSystem = bet.mode === "system";
        const modeTag = isSystem
          ? '<span style="background:var(--blue-dim);color:var(--blue);font-size:0.6rem;font-weight:700;padding:0.15rem 0.4rem;border-radius:4px;margin-left:0.4rem;text-transform:uppercase;">' + t("system") + '</span>'
          : (bet.selections.length > 1
            ? '<span style="background:var(--accent-dim);color:var(--accent);font-size:0.6rem;font-weight:700;padding:0.15rem 0.4rem;border-radius:4px;margin-left:0.4rem;text-transform:uppercase;">' + t("combined") + '</span>'
            : '');

        return '<div class="bet-card ' + bet.status + '">' +
          '<div class="bet-card-header">' +
            '<span class="bet-card-id">' + bet.id + modeTag + '</span>' +
            '<span class="bet-card-date">' + dt.toLocaleDateString() + ' ' + dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + '</span>' +
            '<span class="bet-card-status ' + bet.status + '">' + statusLabel + '</span>' +
          '</div>' +
          bet.selections.map(s => {
            // Look up current match data for live score / final result
            const match = matches.find(m => m.id === s.matchId);
            let scoreHtml = '';
            let statusBadge = '';
            let timeInfo = '';
            if (match) {
              const st = match.status || "Not Started";
              const sc = getStatusClass(st);

              if (sc === "live") {
                // Live: show elapsed minute + pulsing badge
                const min = match.elapsed;
                const minLabel = min ? min + "'" : translateStatus(st);
                statusBadge = '<span class="match-status-badge live" style="font-size:0.55rem;padding:0.1rem 0.35rem;margin-left:0.4rem;">' + minLabel + '</span>';
              } else if (sc === "upcoming") {
                // Upcoming: show kickoff date & time
                const kickoff = new Date(match.date);
                const dayLabel = isToday(kickoff) ? t("today") : isTomorrow(kickoff) ? t("tomorrow") : kickoff.toLocaleDateString();
                const timeLabel = kickoff.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                timeInfo = '<span style="font-size:0.7rem;color:var(--text-muted);margin-left:0.4rem;">⏱ ' + dayLabel + ' ' + timeLabel + '</span>';
              } else {
                // Finished / other
                statusBadge = '<span class="match-status-badge ' + sc + '" style="font-size:0.55rem;padding:0.1rem 0.35rem;margin-left:0.4rem;">' + translateStatus(st) + '</span>';
              }

              if (match.score) {
                scoreHtml = '<span style="font-family:var(--font-mono);color:var(--text-primary);font-weight:700;margin-left:0.4rem;">' + match.score.home + ' - ' + match.score.away + '</span>';
              }
            }
            let resultIcon = '';
            if (s.result === "won") resultIcon = '<span style="color:var(--accent);margin-left:0.3rem;">✓</span>';
            else if (s.result === "lost") resultIcon = '<span style="color:var(--red);margin-left:0.3rem;">✗</span>';
            else if (s.result === "void") resultIcon = '<span style="color:var(--text-muted);margin-left:0.3rem;">—</span>';

            // System bets: show per-selection gain/loss
            let selGain = '';
            if (isSystem && s.result === "won") {
              selGain = '<span style="color:var(--accent);font-weight:700;margin-left:0.5rem;">+ ' + (bet.stake * s.odd).toFixed(2) + ' €</span>';
            } else if (isSystem && s.result === "void") {
              selGain = '<span style="color:var(--text-muted);margin-left:0.5rem;">↩ ' + bet.stake.toFixed(2) + ' €</span>';
            }

            return '<div class="bet-card-selection">' +
              '<div><span class="match">' + s.matchLabel + '</span>' + scoreHtml + statusBadge + timeInfo + '</div>' +
              '<div style="margin-top:0.2rem;"><strong>' + translateSelection(s) + '</strong>' + resultIcon +
              '<span style="color:var(--accent);font-family:var(--font-mono);margin-left:0.5rem;">' + s.odd.toFixed(2) + '</span>' + selGain + '</div>' +
            '</div>';
          }).join("") +
          '<div class="bet-card-footer">' +
            (isSystem
              ? '<span>' + t("perBetStake") + '<br><strong>' + bet.stake.toFixed(2) + ' €</strong></span>' +
                '<span>' + t("totalStake") + '<br><strong>' + (bet.stake * bet.selections.length).toFixed(2) + ' €</strong></span>'
              : '<span>' + t("stake") + '<br><strong>' + bet.stake.toFixed(2) + ' €</strong></span>' +
                '<span>' + t("totalOdds") + '<br><strong>' + (bet.totalOdds || 0).toFixed(2) + '</strong></span>'
            ) +
            (bet.status === "won"
              ? '<span style="color:var(--accent);font-weight:700;">' + t("winnings") + '<br>+ ' + bet.possibleWin.toFixed(2) + ' €</span>'
              : bet.status === "lost"
                ? '<span style="color:var(--red);font-weight:700;">' + t("winnings") + '<br>0.00 €</span>'
                : bet.status === "void"
                  ? '<span style="color:var(--text-muted);">' + t("stake") + '<br>↩ ' + (isSystem ? (bet.stake * bet.selections.length) : bet.stake).toFixed(2) + ' €</span>'
                  : '<span>' + t("possibleWin") + '<br><strong style="color:var(--yellow)">' + bet.possibleWin.toFixed(2) + ' €</strong></span>') +
          '</div>' +
        '</div>';
      };

      document.getElementById("activeBetsList").innerHTML = active.length > 0 ? active.map(renderBet).join("") : '<p style="color:var(--text-muted);padding:1rem;">' + t("noBets") + '</p>';
      document.getElementById("settledBetsList").innerHTML = settled.length > 0 ? settled.map(renderBet).join("") : '<p style="color:var(--text-muted);padding:1rem;">' + t("noBets") + '</p>';
    }

    // ── MOBILE ──
    function toggleSlipMobile() {
      if (betSlip.length === 0) return;
      document.getElementById("betslipSidebar").classList.toggle("open");
    }

    function collapseSlip() {
      document.getElementById("betslipSidebar").classList.remove("open");
    }

    // Betslip: click to toggle, touch-drag to slide
    (function() {
      const sidebar = document.getElementById("betslipSidebar");
      const header = document.getElementById("betslipHeader");
      let startY = 0;
      let isDragging = false;
      let suppressClick = false;

      // ── Touch drag (slide up/down) ──
      header.addEventListener("touchstart", function(e) {
        if (betSlip.length === 0) return;
        startY = e.touches[0].clientY;
        isDragging = false;
        suppressClick = false;
        sidebar.style.transition = "none";
      });

      header.addEventListener("touchmove", function(e) {
        if (betSlip.length === 0) return;
        const currentY = e.touches[0].clientY;
        const moved = Math.abs(currentY - startY);
        // Only start dragging after 8px threshold (ignore tiny finger jitter)
        if (moved < 8 && !isDragging) return;
        e.preventDefault();
        isDragging = true;
        const diff = startY - currentY;
        const viewH = window.innerHeight * 0.7;
        const baseH = sidebar.classList.contains("open") ? window.innerHeight * 0.7 : 50;
        const newH = Math.max(50, Math.min(viewH, baseH + diff));
        sidebar.style.maxHeight = newH + "px";
        sidebar.style.overflowY = newH > 60 ? "auto" : "hidden";
      }, { passive: false });

      header.addEventListener("touchend", function() {
        sidebar.style.transition = "";
        if (isDragging) {
          // Was a real drag — snap based on final position
          suppressClick = true;
          const currentH = parseFloat(sidebar.style.maxHeight) || 50;
          if (currentH > 120) {
            sidebar.classList.add("open");
          } else {
            sidebar.classList.remove("open");
          }
          sidebar.style.maxHeight = "";
          sidebar.style.overflowY = "";
        }
        isDragging = false;
      });

      // ── Click handles all taps (works on both touch and desktop) ──
      header.addEventListener("click", function() {
        if (suppressClick) { suppressClick = false; return; }
        if (betSlip.length === 0) return;
        sidebar.classList.toggle("open");
      });
    })();

    // ── UTILS ──
    function isToday(d) { return d.toDateString() === new Date().toDateString(); }
    function isTomorrow(d) { const t = new Date(); t.setDate(t.getDate()+1); return d.toDateString() === t.toDateString(); }
    function showToast(msg, type) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = "toast " + (type || "success") + " show";
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    init();
  </script>
</body>
