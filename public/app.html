<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FantasyBet</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .match-card { cursor: default; }
    .match-primary-odds { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .match-expand-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.3rem;
      width: 100%; padding: 0.5rem; margin-top: 0.6rem;
      background: transparent; border: 1px dashed var(--border);
      color: var(--text-muted); font-size: 0.75rem; font-weight: 600;
      border-radius: var(--radius-sm); transition: all 0.2s; cursor: pointer;
    }
    .match-expand-btn:hover { border-color: var(--accent); color: var(--accent); }
    .match-expand-btn .arrow { transition: transform 0.2s; display: inline-block; }
    .match-expand-btn.open .arrow { transform: rotate(180deg); }
    .match-expanded { display: none; margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border); }
    .match-expanded.show { display: block; }
    .market-tabs { display: flex; gap: 0.25rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .market-tab {
      padding: 0.35rem 0.7rem; background: var(--bg-input); border: 1px solid transparent;
      color: var(--text-muted); font-size: 0.7rem; font-weight: 700;
      border-radius: 99px; cursor: pointer; text-transform: uppercase;
      letter-spacing: 0.5px; transition: all 0.15s;
    }
    .market-tab:hover { color: var(--text-secondary); }
    .market-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .market-panel { display: none; }
    .market-panel.show { display: block; }
    .market-block { margin-bottom: 0.8rem; }
    .market-block-title {
      font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 700;
      text-align: center;
    }
    .player-odds-grid { display: flex; flex-wrap: wrap; gap: 0.25rem; justify-content: center; }
    .player-odds-grid .player-odd-btn { flex: 0 1 calc(50% - 0.15rem); min-width: 130px; max-width: 220px; }
    .player-odd-btn {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.45rem 0.6rem; background: var(--odds-bg); border: 1px solid transparent;
      border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s;
    }
    .player-odd-btn:hover { background: var(--odds-bg-hover); }
    .player-odd-btn.selected { background: var(--odds-bg-selected); border-color: var(--odds-border-selected); }
    .player-odd-btn .pname { font-size: 0.75rem; color: var(--text-secondary); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
    .player-odd-btn .pvalue { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700; color: var(--accent); }
    .bookmaker-badge { font-size: 0.6rem; color: var(--text-muted); background: var(--bg-input); padding: 0.15rem 0.5rem; border-radius: 99px; margin-left: auto; font-weight: 500; }
    .match-datetime { font-size: 0.72rem; color: var(--text-secondary); font-weight: 500; }
    .match-status-badge { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 0.15rem 0.5rem; border-radius: var(--radius-sm); }
    .match-status-badge.live { background: var(--red-dim); color: var(--red); }
    .match-status-badge.finished { background: rgba(90,100,120,0.15); color: var(--text-muted); }
    .match-status-badge.upcoming { background: var(--blue-dim); color: var(--blue); }
    .score-grid { display: flex; flex-wrap: wrap; gap: 0.25rem; justify-content: center; }
    .score-grid .odd-btn { flex: 0 1 calc(25% - 0.2rem); min-width: 58px; max-width: 100px; }
    .odds-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      justify-content: center;
    }
    .odds-grid .odd-btn {
      flex: 0 1 calc(33.33% - 0.2rem);
      min-width: 80px;
      max-width: 180px;
      min-height: 48px;
      justify-content: center;
      padding: 0.3rem 0.4rem;
    }
    .odds-grid .odd-btn .label {
      font-size: 0.68rem;
      line-height: 1.2;
    }
    .odds-grid .odd-btn .value {
      font-size: 0.78rem;
    }

    /* ── League dropdown ── */
    .league-dropdown {
      position: relative;
      display: inline-block;
    }
    .league-dropdown-toggle {
      display: flex; align-items: center; gap: 0.3rem;
    }
    .league-dropdown-toggle .dd-arrow {
      font-size: 0.65rem; transition: transform 0.2s;
    }
    .league-dropdown-menu {
      display: none;
      position: fixed;
      min-width: 280px;
      max-height: 350px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 9999;
      overflow: hidden;
      flex-direction: column;
    }
    .league-dropdown-menu.open {
      display: flex;
    }
    .league-search-input {
      padding: 0.6rem 0.8rem;
      background: var(--bg-input);
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 16px; /* must be >= 16px to prevent Safari mobile zoom on focus */
      outline: none;
      font-family: inherit;
    }
    .league-search-input::placeholder {
      color: var(--text-muted);
    }
    .league-dropdown-list {
      overflow-y: auto;
      max-height: 290px;
      padding: 0.3rem;
    }
    .league-dropdown-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem 0.7rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .league-dropdown-item:hover {
      background: var(--bg-input);
      color: var(--text-primary);
    }
    .league-dropdown-item.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .league-dropdown-item .league-country {
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    /* ── League badge on match cards (chronological mode) ── */
    .match-league-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }
    .match-league-badge .league-country-sm {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }
    /* ── Top bar when no league badge (grouped by league mode) ── */
    .match-top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.4rem;
    }

    /* ── Live clock ── */
    .live-clock {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-input);
      padding: 0.3rem 0.7rem;
      border-radius: var(--radius-sm);
      letter-spacing: 0.5px;
    }

    /* ── Sort toggle ── */
    .sort-toggle {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .sort-toggle-btn {
      padding: 0.4rem 0.8rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }
    .sort-toggle-btn:hover {
      color: var(--text-secondary);
    }
    .sort-toggle-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    /* ── Live notice banner ── */
    .live-notice {
      background: var(--blue-dim, rgba(59,130,246,0.1));
      border: 1px solid var(--blue, #3b82f6);
      color: var(--blue, #3b82f6);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.7rem 1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      text-align: center;
      line-height: 1.4;
    }
    .live-notice-icon {
      margin-right: 0.3rem;
    }

    .matches-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 0.5rem;
    }

    /* ── Team logos ── */
    .team-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="header-logo">Fantasy<span>Bet</span></div>
        <nav class="header-nav">
          <button class="active" onclick="showPage('home')" id="navHome">Home</button>
          <button onclick="showPage('mybets')" id="navMyBets">My Bets</button>
        </nav>
      </div>
      <div class="header-right">
        <div class="live-clock" id="liveClock">--:--:--</div>
        <span class="sse-indicator" id="sseIndicator"><span class="sse-dot" id="sseDot"></span></span>
        <div class="credits-display">
          <span class="amount" id="creditsAmount">0 €</span>
        </div>
        <button class="mybets-btn" id="myBetsBtn" onclick="showPage('mybets')"></button>
        <button class="logout-btn" id="logoutBtn" onclick="logout()">Log Out</button>
      </div>
    </header>

    <!-- MAIN -->
    <div class="main-content">
      <div class="matches-section" id="homePage">
        <div class="league-tabs" id="leagueTabs"></div>
        <div class="matches-toolbar" id="matchesToolbar">
          <div class="sort-toggle" id="sortToggle">
            <button class="sort-toggle-btn active" id="sortByTimeBtn" onclick="setSortMode('time')">⏱ By Time</button>
            <button class="sort-toggle-btn" id="sortByLeagueBtn" onclick="setSortMode('league')">⚽ By League</button>
            <button class="sort-toggle-btn" id="sortLiveBtn" onclick="setSortMode('live')">🔴 Live</button>
            <button class="sort-toggle-btn" id="sortFinishedBtn" onclick="setSortMode('finished')">✓ Finished</button>
          </div>
        </div>
        <div id="matchesList"></div>
      </div>

      <div class="bets-page" id="mybetsPage" style="display:none;">
        <div class="bets-tab-toggle">
          <button class="bets-tab active" id="tabActive" onclick="switchBetsTab('active')">Active Bets</button>
          <button class="bets-tab" id="tabSettled" onclick="switchBetsTab('settled')">Settled Bets</button>
        </div>
        <div id="activeBetsSection">
          <div id="activeBetsList"></div>
        </div>
        <div id="settledBetsSection" style="display:none;">
          <div id="settledBetsList"></div>
        </div>
      </div>

      <aside class="betslip-sidebar" id="betslipSidebar">
        <div class="betslip-header" id="betslipHeader">
          <div class="betslip-header-left">
            <h3 id="betslipTitle">Bet Slip</h3>
            <div class="betslip-count" id="slipCount">0</div>
          </div>
          <span class="betslip-expand-arrow" id="slipArrow">&#9650;</span>
        </div>
        <div class="betslip-mode-toggle" id="betslipModeToggle" style="display:none;">
          <button class="mode-btn active" id="modeCombined" onclick="setBetSlipMode('combined')">Combined</button>
          <button class="mode-btn" id="modeSystem" onclick="setBetSlipMode('system')">System</button>
        </div>
        <div class="betslip-body" id="betslipBody">
          <div class="betslip-empty" id="betslipEmpty">
            <div class="icon">🎫</div>
            <p id="emptySlipText">Your bet slip is empty</p>
            <p class="hint" id="emptySlipHint">Click on odds to add selections</p>
          </div>
          <div id="betslipItems"></div>
        </div>
        <div class="betslip-footer" id="betslipFooter" style="display:none;">
          <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">
            <div class="stake-input-group" style="flex:0 1 55%;margin-bottom:0;">
              <label id="stakeLabel">Stake</label>
              <input type="number" id="stakeInput" min="5" placeholder="min. 5" style="font-size:16px;" oninput="updateSlipSummary()">
              <span class="currency">€</span>
            </div>
            <label class="accept-odds-row" for="acceptOddsToggle" style="flex:1;cursor:pointer;">
              <div class="accept-odds-toggle">
                <input type="checkbox" id="acceptOddsToggle" checked onchange="acceptOddsChanges = this.checked">
                <span class="slider"></span>
              </div>
              <span id="acceptOddsLabel" style="font-size:0.68rem;line-height:1.2;">Odds</span>
            </label>
          </div>
          <div class="stake-presets">
            <button onclick="setStake(5)">5</button>
            <button onclick="setStake(10)">10</button>
            <button onclick="setStake(50)">50</button>
            <button onclick="setStake(100)">100</button>
            <button onclick="setStake(500)">500</button>
          </div>
          <div class="betslip-summary">
            <div class="summary-col">
              <span class="label" id="totalOddsLabel">Total Odds</span>
              <span class="value" id="totalOddsValue">0.00</span>
            </div>
            <div class="summary-col total">
              <span class="label" id="possibleWinLabel">Potential Win</span>
              <span class="value" id="possibleWinValue">0.00 €</span>
            </div>
          </div>
          <button class="place-bet-btn" id="placeBetBtn" onclick="placeBet()">PLACE BET</button>
        </div>
      </aside>
    </div>

  </div>

  <div class="toast" id="toast"></div>
  <div class="toast-container" id="toastContainer"></div>
  <div id="oddsChangeModal"></div>


  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/matches.js"></script>
  <script>
    // ── STATE ──
    let currentUser = null;
    let betSlip = [];
    let betSlipMode = "combined"; // "combined" or "system"
    let currentLeague = "all";
    let sortMode = "time"; // "time" or "league"
    let matches = [];
    let acceptOddsChanges = true;
    let liveOddsMap = {};      // { fixtureId: { odds: [...], fixtureStatus: {...}, update: string } }
    let sseSource = null;
    let sseConnected = false;

    // ── LIVE CLOCK ──
    function startClock() {
      function tick() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, "0");
        const m = String(now.getMinutes()).padStart(2, "0");
        const s = String(now.getSeconds()).padStart(2, "0");
        document.getElementById("liveClock").textContent = h + ":" + m + ":" + s;
      }
      tick();
      setInterval(tick, 1000);
    }

    // ── SORT MODE ──
    function setSortMode(mode) {
      sortMode = mode;
      document.querySelectorAll(".sort-toggle-btn").forEach(b => b.classList.remove("active"));
      const btnMap = { time: "sortByTimeBtn", league: "sortByLeagueBtn", live: "sortLiveBtn", finished: "sortFinishedBtn" };
      document.getElementById(btnMap[mode])?.classList.add("active");
      renderMatches();
    }

    function updateSortToggle() {
      document.getElementById("sortByTimeBtn").textContent = "⏱ " + t("sortByTime");
      document.getElementById("sortByLeagueBtn").textContent = "⚽ " + t("sortByLeague");
      document.getElementById("sortLiveBtn").textContent = "🔴 " + t("live");
      document.getElementById("sortFinishedBtn").textContent = "✓ " + t("finished");
      // Only show sort toggle in "All Leagues" mode
      document.getElementById("matchesToolbar").style.display = currentLeague === "all" ? "flex" : "none";
    }

    // ── INIT ──
    async function init() {
      const userData = localStorage.getItem("betzone_user");
      if (!userData) { window.location.href = "index.html"; return; }
      currentUser = JSON.parse(userData);
      startClock();
      // Refresh credits from server
      try {
        const res = await fetch("/api/users/" + currentUser.id);
        if (res.ok) {
          const fresh = await res.json();
          currentUser.credits = fresh.credits;
          localStorage.setItem("betzone_user", JSON.stringify(currentUser));
        }
      } catch (e) {}
      const apiData = await getMatches();
      // Show matches that have odds OR are currently live/starting
      const LIVE_SHORT_SET = new Set(["1H", "HT", "2H", "ET", "BT", "P", "INT", "LIVE"]);
      matches = apiData.filter(m => (m.bets && m.bets.length > 0) || LIVE_SHORT_SET.has(m.statusShort));
      // Seed liveOddsMap from initial API response
      if (apiData.liveOdds && Array.isArray(apiData.liveOdds)) {
        apiData.liveOdds.forEach(lo => { liveOddsMap[lo.fixtureId] = lo; });
      }
      updateUI();
      renderLeagueTabs();
      updateSortToggle();
      showPage('home');

      // Connect to SSE for real-time updates
      connectSSE();

      // "Starting" tag checker: every second, check if any NS match is within 60s of kickoff
      setInterval(checkStartingMatches, 1000);
    }

    // ══════════════════════════════════════════
    // SSE CONNECTION
    // ══════════════════════════════════════════
    function connectSSE() {
      if (sseSource) { sseSource.close(); }
      sseSource = new EventSource("/api/live-stream");

      sseSource.addEventListener("connected", (e) => {
        sseConnected = true;
        document.getElementById("sseDot").className = "sse-dot connected";
        console.log("[SSE] Connected", JSON.parse(e.data));
      });

      sseSource.addEventListener("liveOdds", (e) => {
        const oddsArr = JSON.parse(e.data);
        handleLiveOdds(oddsArr);
      });

      sseSource.addEventListener("liveScores", (e) => {
        const updates = JSON.parse(e.data);
        handleLiveScores(updates);
      });

      sseSource.addEventListener("fixturesUpdate", async (e) => {
        console.log("[SSE] Fixtures updated");
        _matchesCache = null;
        const fresh = await getMatches();
        matches = fresh.filter(m => (m.bets && m.bets.length > 0) || LIVE_SHORT_SET.has(m.statusShort));
        renderLeagueTabs();
        renderMatches();
      });

      sseSource.addEventListener("oddsUpdate", async (e) => {
        console.log("[SSE] Pre-match odds updated");
        _matchesCache = null;
        const fresh = await getMatches();
        matches = fresh.filter(m => (m.bets && m.bets.length > 0) || LIVE_SHORT_SET.has(m.statusShort));
        renderMatches();
      });

      sseSource.addEventListener("settled", async (e) => {
        const data = JSON.parse(e.data);
        console.log("[SSE] Bets settled:", data.settled);
        // Refresh credits
        try {
          const res = await fetch("/api/users/" + currentUser.id);
          if (res.ok) {
            const u = await res.json();
            currentUser.credits = u.credits;
            localStorage.setItem("betzone_user", JSON.stringify(currentUser));
            document.getElementById("creditsAmount").textContent = (currentUser.credits || 0).toLocaleString() + " €";
          }
        } catch (e2) {}
        // Refresh my bets if visible
        if (document.getElementById("mybetsPage").style.display !== "none") {
          renderMyBets();
        }
      });

      sseSource.onerror = () => {
        sseConnected = false;
        document.getElementById("sseDot").className = "sse-dot disconnected";
      };
    }

    // ── Handle live odds from SSE (every 5s) ──
    function handleLiveOdds(oddsArr) {
      let cardRebuilt = false;
      oddsArr.forEach(item => {
        const prev = liveOddsMap[item.fixtureId];
        liveOddsMap[item.fixtureId] = item;

        // Check if available markets changed (first live odds or bet IDs differ) → re-render card
        const prevBetIds = prev ? (prev.odds || []).map(b => b.id).sort().join(",") : "";
        const newBetIds = (item.odds || []).map(b => b.id).sort().join(",");
        const card = document.getElementById("card-" + item.fixtureId);
        if (card && (!prev || prevBetIds !== newBetIds)) {
          // Markets changed — full card re-render to show only live markets
          const match = matches.find(m => m.id === item.fixtureId);
          if (match) {
            const showLeagueBadge = sortMode !== "league";
            const tmp = document.createElement("div");
            tmp.innerHTML = renderMatchCard(match, showLeagueBadge);
            const newCard = tmp.firstElementChild;
            card.replaceWith(newCard);
            cardRebuilt = true;
          }
        } else {
          // Same markets — in-place DOM update with animations
          updateOddsInDOM(item.fixtureId, item.odds, prev?.odds || []);
          // If expanded panel was loaded, mark stale so next open rebuilds
          const expEl = document.getElementById("expanded-" + item.fixtureId);
          if (expEl && expEl.dataset.loaded && expEl.classList.contains("show")) {
            // Panel is open — update odds in-place (already handled above via data-odd-key)
          } else if (expEl && expEl.dataset.loaded) {
            // Panel is closed — clear so next open gets fresh data
            delete expEl.dataset.loaded;
            expEl.innerHTML = "";
          }
        }

        // Check betslip for odds changes and suspended bets
        checkBetslipOddsChanges(item);
      });
      // Re-sync selected highlights after any card rebuilds
      if (cardRebuilt) syncOddButtons();
    }

    // ── Update visible odds values in the DOM without full re-render ──
    function updateOddsInDOM(fixtureId, newOdds, prevOdds) {
      // Build prev lookup: betId-value → odd
      const prevMap = {};
      prevOdds.forEach(bet => {
        (bet.values || []).forEach(v => {
          prevMap[bet.id + "-" + v.value] = v.odd;
        });
      });

      newOdds.forEach(bet => {
        (bet.values || []).forEach(v => {
          const key = fixtureId + "-" + bet.id + "-" + v.value;
          const el = document.querySelector('[data-odd-key="' + CSS.escape(key) + '"]');
          if (!el) return;

          const newVal = parseFloat(v.odd).toFixed(2);
          const oldText = el.textContent.trim();

          // Handle suspended
          const btn = el.closest(".odd-btn, .player-odd-btn, .score-btn");
          if (v.suspended) {
            if (btn) btn.classList.add("suspended");
            return;
          } else {
            if (btn) btn.classList.remove("suspended");
          }

          if (newVal !== oldText) {
            const prevVal = prevMap[bet.id + "-" + v.value];
            el.textContent = newVal;
            el.classList.remove("flash-up", "flash-down");
            void el.offsetWidth; // reflow to restart animation
            if (prevVal && parseFloat(v.odd) > parseFloat(prevVal)) {
              el.classList.add("flash-up");
            } else {
              el.classList.add("flash-down");
            }
          }
        });
      });
    }

    // ── Check betslip selections against live odds ──
    function checkBetslipOddsChanges(liveItem) {
      const fixtureId = liveItem.fixtureId;
      const status = liveItem.fixtureStatus || {};
      let changed = false;

      for (let i = betSlip.length - 1; i >= 0; i--) {
        const sel = betSlip[i];
        if (sel.matchId !== fixtureId) continue;

        // Find matching bet in live odds
        const liveBet = (liveItem.odds || []).find(b => b.id === sel.betId);
        if (!liveBet) continue;

        const liveVal = (liveBet.values || []).find(v => v.value === sel.pick);

        // If suspended or not found → remove from betslip
        if (!liveVal || liveVal.suspended || status.stopped || status.blocked) {
          const removedLabel = sel.matchLabel + " — " + translateSelection(sel);
          betSlip.splice(i, 1);
          showStackToast(removedLabel + " " + t("betRemoved"), "error");
          changed = true;
          continue;
        }

        // If odds changed
        const newOdd = parseFloat(liveVal.odd);
        if (Math.abs(newOdd - sel.odd) > 0.001) {
          if (acceptOddsChanges) {
            // Auto-update
            sel.odd = newOdd;
            changed = true;
          } else {
            // Show prompt
            showOddsChangeModal(sel, newOdd, i);
          }
        }
      }

      if (changed) {
        renderBetSlip();
        syncOddButtons();
      }
    }

    // ── Handle live scores from SSE (every 15s) ──
    function handleLiveScores(updates) {
      let anyChanged = false;
      let statusChanged = false;
      let slipCleaned = false;
      updates.forEach(u => {
        const match = matches.find(m => m.id === u.id);
        if (!match) return;

        const prevStatusClass = getStatusClass(match.status, match.date);
        match.status = u.status;
        match.statusShort = u.statusShort;
        match.elapsed = u.elapsed;
        if (u.score) match.score = u.score;
        anyChanged = true;

        const newStatusClass = getStatusClass(u.status, match.date);

        // If match finished → remove its selections from betslip
        if (newStatusClass === "finished" && prevStatusClass !== "finished") {
          for (let i = betSlip.length - 1; i >= 0; i--) {
            if (betSlip[i].matchId === u.id) {
              const label = betSlip[i].matchLabel + " — " + translateSelection(betSlip[i]);
              showStackToast(label + " " + t("betRemoved"), "error");
              betSlip.splice(i, 1);
              slipCleaned = true;
            }
          }
        }

        // If match changed category (went live or finished) → need full view re-render
        if (prevStatusClass !== newStatusClass) {
          statusChanged = true;
          return; // renderMatches() below will rebuild everything
        }

        // Update score in DOM
        const scoreHome = document.querySelector('[data-score-home="' + u.id + '"]');
        const scoreAway = document.querySelector('[data-score-away="' + u.id + '"]');
        if (scoreHome && u.score) scoreHome.textContent = u.score.home;
        if (scoreAway && u.score) scoreAway.textContent = u.score.away;

        // Update status badge in DOM
        const badge = document.querySelector('[data-match-status="' + u.id + '"]');
        if (badge) {
          const sc = getStatusClass(u.status);
          badge.className = "match-status-badge " + sc;
          if (sc === "live" && u.elapsed) {
            badge.textContent = u.elapsed + "'";
          } else {
            badge.textContent = translateStatus(u.status);
          }
        }
      });

      // If betslip was cleaned, refresh it
      if (slipCleaned) {
        renderBetSlip();
        syncOddButtons();
      }

      // If any match changed status category, re-render the full view so it moves tabs
      if (statusChanged) {
        renderMatches();
      }

      // Also refresh My Bets if visible (scores update there too)
      if (anyChanged && document.getElementById("mybetsPage").style.display !== "none") {
        renderMyBets();
      }
    }

    // ── Check for "starting" matches (1 min before kickoff) ──
    function checkStartingMatches() {
      const now = Date.now();
      matches.forEach(m => {
        if (m.status !== "Not Started" && m.statusShort !== "NS") return;
        const kickoff = new Date(m.date).getTime();
        const diff = kickoff - now;
        if (diff <= 60000 && diff > -300000) { // 1 min before to 5 min after (in case of delayed start)
          const badge = document.querySelector('[data-match-status="' + m.id + '"]');
          if (badge && !badge.classList.contains("starting")) {
            badge.className = "match-status-badge starting";
            badge.textContent = t("starting");
          }
          const card = document.getElementById("card-" + m.id);
          if (card) card.classList.add("starting");
        }
      });
    }

    // ── LEAGUE TABS ──
    function renderLeagueTabs() {
      // Collect unique leagues from current matches (keyed by name|country)
      const allLeagues = [];
      const seen = new Set();
      matches.forEach(m => {
        const uid = m.league.name + "|" + (m.league.country || "");
        if (!seen.has(uid)) {
          seen.add(uid);
          allLeagues.push({
            key: m.league.name,
            name: m.league.name,
            country: m.league.country || "",
            priority: getLeaguePriority(m.league.name, m.league.country || ""),
          });
        }
      });

      // Sort all leagues by priority, then alphabetically for same priority
      allLeagues.sort((a, b) => {
        if (a.priority !== b.priority) return a.priority - b.priority;
        return a.name.localeCompare(b.name);
      });

      // Top N prioritized leagues become buttons; rest go to dropdown
      const shownButtons = allLeagues.slice(0, MAX_FEATURED);
      const dropdownLeagues = allLeagues.slice(MAX_FEATURED);

      const container = document.getElementById("leagueTabs");
      let html = '<button class="league-tab ' + (currentLeague === "all" ? "active" : "") + '" onclick="filterLeague(\'all\')">' + t("allLeagues") + '</button>';

      shownButtons.forEach(l => {
        html += '<button class="league-tab ' + (currentLeague === l.key ? "active" : "") + '" onclick="filterLeague(\'' + esc(l.key) + '\')">' + l.name + '</button>';
      });

      if (dropdownLeagues.length > 0) {
        const isDropdownActive = dropdownLeagues.some(l => currentLeague === l.key);
        html += '<button class="league-tab league-dropdown-toggle ' + (isDropdownActive ? "active" : "") + '" id="leagueDropdownBtn" onclick="toggleLeagueDropdown(event)">';
        html += (isDropdownActive ? currentLeague : t("otherLeagues")) + ' <span class="dd-arrow">▾</span></button>';

        // Build dropdown menu HTML (will be appended to body)
        let ddHtml = '<input type="text" class="league-search-input" placeholder="' + t("searchLeagues") + '" oninput="filterLeagueDropdown(this.value)" onclick="event.stopPropagation()">';
        ddHtml += '<div class="league-dropdown-list" id="leagueDropdownList">';
        dropdownLeagues.forEach(l => {
          const label = l.name + (l.country ? ' <span class="league-country">(' + l.country + ')</span>' : '');
          ddHtml += '<button class="league-dropdown-item ' + (currentLeague === l.key ? "active" : "") + '" data-league="' + esc(l.key) + '" onclick="selectDropdownLeague(\'' + esc(l.key) + '\')">' + label + '</button>';
        });
        ddHtml += '</div>';

        // Remove old dropdown from body if exists, then add new one
        let ddMenu = document.getElementById("leagueDropdownMenu");
        if (ddMenu) ddMenu.remove();
        ddMenu = document.createElement("div");
        ddMenu.className = "league-dropdown-menu";
        ddMenu.id = "leagueDropdownMenu";
        ddMenu.innerHTML = ddHtml;
        document.body.appendChild(ddMenu);
      } else {
        // No dropdown leagues — remove menu if exists
        const ddMenu = document.getElementById("leagueDropdownMenu");
        if (ddMenu) ddMenu.remove();
      }

      container.innerHTML = html;
    }

    function toggleLeagueDropdown(e) {
      e.stopPropagation();
      const menu = document.getElementById("leagueDropdownMenu");
      menu.classList.toggle("open");
      if (menu.classList.contains("open")) {
        // Position the fixed dropdown below the toggle button
        const btn = e.currentTarget;
        const rect = btn.getBoundingClientRect();
        menu.style.top = (rect.bottom + 6) + "px";
        menu.style.left = rect.left + "px";
        // Ensure it doesn't overflow right edge
        requestAnimationFrame(() => {
          const menuRect = menu.getBoundingClientRect();
          if (menuRect.right > window.innerWidth - 8) {
            menu.style.left = Math.max(8, window.innerWidth - menuRect.width - 8) + "px";
          }
        });
        menu.querySelector(".league-search-input")?.focus();
        document.addEventListener("click", closeLeagueDropdown, { once: true });
      }
    }

    // ── RENDER MATCHES ──
    const STATUS_I18N_MAP = {
      "Not Started": "statusNotStarted",
      "First Half": "statusFirstHalf",
      "Halftime": "statusHalftime",
      "Second Half": "statusSecondHalf",
      "Extra Time": "statusExtraTime",
      "Break Time": "statusBreakTime",
      "Penalty In Progress": "statusPenalty",
      "Match Finished": "statusFinished",
      "After Extra Time": "statusFinishedAET",
      "After Penalty": "statusFinishedAP",
      "Match Postponed": "statusPostponed",
      "Match Cancelled": "statusCancelled",
      "Match Suspended": "statusSuspended",
      "Match Interrupted": "statusInterrupted",
      "Match Abandoned": "statusAbandoned",
      "Time to be defined": "statusTBD",
    };

    function translateStatus(status) {
      const key = STATUS_I18N_MAP[status];
      return key ? t(key) : status;
    }

    const LIVE_STATUSES = new Set([
      "First Half", "Halftime", "Second Half",
      "Extra Time", "Break Time", "Penalty In Progress",
    ]);
    const FINISHED_STATUSES = new Set([
      "Match Finished", "After Extra Time", "After Penalty",
      "Match Postponed", "Match Cancelled", "Match Suspended",
      "Match Interrupted", "Match Abandoned",
    ]);

    function getStatusClass(status, matchDate) {
      if (FINISHED_STATUSES.has(status)) return "finished";
      if (LIVE_STATUSES.has(status)) return "live";
      // "Starting" = Not Started + within 1 minute of kickoff
      if (status === "Not Started" && matchDate) {
        const diff = new Date(matchDate).getTime() - Date.now();
        if (diff <= 60000 && diff > -300000) return "starting";
      }
      return "upcoming";
    }

    function renderMatches() {
      let filtered = matches;
      if (currentLeague !== "all") {
        filtered = filtered.filter(m => m.league.name === currentLeague);
      }

      // Save expanded states before re-render
      const expandedIds = new Set();
      document.querySelectorAll('.match-expanded.show').forEach(el => {
        const mid = el.id.replace('expanded-', '');
        if (mid) expandedIds.add(mid);
      });
      // Save active market tab per match
      const activeTabs = {};
      document.querySelectorAll('.market-tab.active').forEach(el => {
        const panel = el.getAttribute('onclick');
        const match = panel?.match(/switchMarketTab\('([^']+)',\s*'([^']+)'\)/);
        if (match) activeTabs[match[1]] = match[2];
      });

      const container = document.getElementById("matchesList");
      if (filtered.length === 0) {
        container.innerHTML = '<div class="betslip-empty" style="padding:3rem;"><div class="icon">⚽</div><p>' + t("noMatches") + '</p></div>';
        return;
      }

      if (sortMode === "live") {
        // ── Live + Starting matches ──
        const liveMatches = filtered.filter(m => {
          const sc = getStatusClass(m.status || "Not Started", m.date);
          return sc === "live" || sc === "starting";
        });
        if (liveMatches.length === 0) {
          container.innerHTML = '<div class="betslip-empty" style="padding:3rem;"><div class="icon">⚽</div><p>' + t("noMatches") + '</p></div>';
          return;
        }
        const sorted = [...liveMatches].sort((a, b) => new Date(a.date) - new Date(b.date));
        let html = "";
        sorted.forEach(m => { html += renderMatchCard(m, true); });
        container.innerHTML = html;
      } else if (sortMode === "finished") {
        // ── Finished matches only ──
        const finishedMatches = filtered.filter(m => getStatusClass(m.status || "Not Started", m.date) === "finished");
        if (finishedMatches.length === 0) {
          container.innerHTML = '<div class="betslip-empty" style="padding:3rem;"><div class="icon">⚽</div><p>' + t("noMatches") + '</p></div>';
          return;
        }
        const sorted = [...finishedMatches].sort((a, b) => new Date(b.date) - new Date(a.date));
        let html = "";
        sorted.forEach(m => { html += renderMatchCard(m, true); });
        container.innerHTML = html;
      } else {
        // ── By Time / By League / Specific league: upcoming only ──
        const now = new Date();
        const upcoming = filtered.filter(m => {
          const sc = getStatusClass(m.status || "Not Started", m.date);
          if (sc !== "upcoming") return false;
          return new Date(m.date) > now;
        });
        if (upcoming.length === 0) {
          container.innerHTML = '<div class="betslip-empty" style="padding:3rem;"><div class="icon">⚽</div><p>' + t("noMatches") + '</p></div>';
          return;
        }

        if (sortMode === "league" || currentLeague !== "all") {
          renderGroupedByLeague(upcoming, container);
        } else {
          const sorted = [...upcoming].sort((a, b) => new Date(a.date) - new Date(b.date));
          let html = "";
          sorted.forEach(m => { html += renderMatchCard(m, true); });
          container.innerHTML = html;
        }
      }

      // Restore expanded states and active tabs after re-render
      expandedIds.forEach(mid => {
        // Trigger lazy-load + expand for previously open matches
        toggleExpand(mid);
      });
      for (const [mid, tabId] of Object.entries(activeTabs)) {
        const card = document.getElementById("card-" + mid);
        if (!card) continue;
        const tab = card.querySelector(".market-tab[onclick*=\"'" + tabId + "'\"]");
        if (tab) {
          card.querySelectorAll('.market-tab').forEach(t => t.classList.remove('active'));
          card.querySelectorAll('.market-panel').forEach(p => p.classList.remove('show'));
          tab.classList.add('active');
          const panel = document.getElementById("panel-" + mid + "-" + tabId);
          if (panel) panel.classList.add('show');
        }
      }
    }

    function renderGroupedByLeague(filtered, container) {
      // Group matches by league
      const groups = {};
      filtered.forEach(m => {
        const key = m.league.name + "|" + (m.league.country || "");
        if (!groups[key]) groups[key] = { name: m.league.name, country: m.league.country, matches: [] };
        groups[key].matches.push(m);
      });

      // Sort groups by priority, then alphabetically for unprioritized
      const sortedGroups = Object.values(groups).sort((a, b) => {
        const pa = getLeaguePriority(a.name, a.country);
        const pb = getLeaguePriority(b.name, b.country);
        if (pa !== pb) return pa - pb;
        // Same priority (both 9999) → alphabetical
        const nameA = a.name + (a.country || "");
        const nameB = b.name + (b.country || "");
        return nameA.localeCompare(nameB);
      });

      let html = "";
      sortedGroups.forEach(g => {
        const title = g.name + (g.country ? " - " + g.country : "");
        html += '<div class="league-group">';
        html += '<div class="league-header"><span class="name">' + title + '</span><span class="count">' + g.matches.length + '</span></div>';
        g.matches.forEach(m => { html += renderMatchCard(m); });
        html += '</div>';
      });
      container.innerHTML = html;
    }

    // ── RENDER MATCH CARD ──
    function renderMatchCard(match, showLeagueBadge) {
      const mid = match.id;
      const dt = new Date(match.date);
      const timeStr = dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateStr = isToday(dt) ? t("today") : isTomorrow(dt) ? t("tomorrow") : dt.toLocaleDateString();
      const homeName = match.home.name;
      const awayName = match.away.name;
      const homeLogo = match.home.logo ? '<img class="team-logo" src="' + match.home.logo + '" alt="" onerror="this.style.display=\'none\'">' : '';
      const awayLogo = match.away.logo ? '<img class="team-logo" src="' + match.away.logo + '" alt="" onerror="this.style.display=\'none\'">' : '';
      // Status badge
      const status = match.status || "Not Started";
      const statusClass = getStatusClass(status, match.date);

      // Disable betting only for finished matches — live and starting matches allow betting
      const bettingDisabled = statusClass === "finished";

      // For live matches, use ONLY live odds (not pre-match odds)
      const liveData = liveOddsMap[mid];
      const isLive = statusClass === "live";
      const bets = isLive
        ? (liveData && liveData.odds ? liveData.odds : [])
        : (match.bets || []);

      // Score display with data attributes for SSE updates
      let scoreHtml = '<div class="match-vs">vs</div>';
      if (match.score) {
        scoreHtml = '<div class="match-score"><span data-score-home="' + mid + '">' + match.score.home + '</span><span class="divider">-</span><span data-score-away="' + mid + '">' + match.score.away + '</span></div>';
      }

      // ── Primary odds ──
      let primaryHtml = '';
      if (isLive) {
        // Live: find primary markets by NAME pattern (live API uses different IDs)
        const lw = bets.find(b => /^draw no bet$/i.test(b.name)) ||
                   bets.find(b => /^1x2\b/i.test(b.name) && !/half/i.test(b.name));
        const lou = bets.find(b => /^match goals$/i.test(b.name)) ||
                    bets.find(b => /^over\/under line$/i.test(b.name));

        if (lw) {
          const h = lw.values.find(v => v.value === "Home");
          const d = lw.values.find(v => v.value === "Draw");
          const a = lw.values.find(v => v.value === "Away");
          const lwTitle = translateLiveBetName(lw.name);
          primaryHtml += '<div class="odds-group"><div class="odds-group-title">' + lwTitle + '</div><div class="odds-row">';
          if (h) primaryHtml += oddBtn(mid, lw.id, "Home", t("home"), h.odd, lw.name, bettingDisabled, h.suspended);
          if (d) primaryHtml += oddBtn(mid, lw.id, "Draw", t("draw"), d.odd, lw.name, bettingDisabled, d.suspended);
          if (a) primaryHtml += oddBtn(mid, lw.id, "Away", t("away"), a.odd, lw.name, bettingDisabled, a.suspended);
          primaryHtml += '</div></div>';
        }
        if (lou) {
          // Find the O/U line closest to 2.5
          const overVals = lou.values.filter(v => v.value.startsWith("Over"));
          const best = overVals.reduce((best, v) => {
            const line = parseFloat(v.value.replace("Over ", ""));
            const bestLine = best ? parseFloat(best.value.replace("Over ", "")) : Infinity;
            return Math.abs(line - 2.5) < Math.abs(bestLine - 2.5) ? v : best;
          }, null);
          if (best) {
            const line = best.value.replace("Over ", "");
            const un = lou.values.find(v => v.value === "Under " + line);
            if (un) {
              const louTitle = translateLiveBetName(lou.name);
              primaryHtml += '<div class="odds-group"><div class="odds-group-title">' + louTitle + '</div><div class="odds-row">';
              primaryHtml += oddBtn(mid, lou.id, best.value, t("over") + ' ' + line, best.odd, lou.name, bettingDisabled, best.suspended);
              primaryHtml += oddBtn(mid, lou.id, un.value, t("under") + ' ' + line, un.odd, lou.name, bettingDisabled, un.suspended);
              primaryHtml += '</div></div>';
            }
          }
        }
      } else {
        // Pre-match: find by Bet365 IDs
        const matchWinner = bets.find(b => b.id === 1);
        const goalsOU = bets.find(b => b.id === 5);
        const btts = bets.find(b => b.id === 8);

        if (matchWinner) {
          const h = matchWinner.values.find(v => v.value === "Home");
          const d = matchWinner.values.find(v => v.value === "Draw");
          const a = matchWinner.values.find(v => v.value === "Away");
          primaryHtml += '<div class="odds-group"><div class="odds-group-title">1X2</div><div class="odds-row">';
          if (h) primaryHtml += oddBtn(mid, 1, "Home", "1", h.odd, "Match Winner", bettingDisabled);
          if (d) primaryHtml += oddBtn(mid, 1, "Draw", "X", d.odd, "Match Winner", bettingDisabled);
          if (a) primaryHtml += oddBtn(mid, 1, "Away", "2", a.odd, "Match Winner", bettingDisabled);
          primaryHtml += '</div></div>';
        }

        if (goalsOU) {
          const ov = goalsOU.values.find(v => v.value === "Over 2.5");
          const un = goalsOU.values.find(v => v.value === "Under 2.5");
          if (ov && un) {
            primaryHtml += '<div class="odds-group"><div class="odds-group-title">' + t("over") + '/' + t("under") + ' 2.5</div><div class="odds-row">';
            primaryHtml += oddBtn(mid, 5, "Over 2.5", t("over"), ov.odd, "Goals Over/Under", bettingDisabled);
            primaryHtml += oddBtn(mid, 5, "Under 2.5", t("under"), un.odd, "Goals Over/Under", bettingDisabled);
            primaryHtml += '</div></div>';
          }
        }

        if (btts) {
          const y = btts.values.find(v => v.value === "Yes");
          const n = btts.values.find(v => v.value === "No");
          if (y && n) {
            primaryHtml += '<div class="odds-group"><div class="odds-group-title">' + betName(8, "Both Teams Score") + '</div><div class="odds-row">';
            primaryHtml += oddBtn(mid, 8, "Yes", t("yes"), y.odd, "Both Teams Score", bettingDisabled);
            primaryHtml += oddBtn(mid, 8, "No", t("no"), n.odd, "Both Teams Score", bettingDisabled);
            primaryHtml += '</div></div>';
          }
        }
      }

      // ── Expanded markets: only check if markets exist, don't build HTML yet (lazy) ──
      const hasExpandedMarkets = bets.length > 0;

      const liveMinute = statusClass === "live" && match.elapsed ? match.elapsed + "'" : null;
      const statusText = statusClass === "starting" ? t("starting") : (liveMinute ? liveMinute : translateStatus(status));
      const statusBadgeHtml = '<span class="match-status-badge ' + statusClass + '" data-match-status="' + mid + '">' +
        statusText +
      '</span>';
      const leagueBadge = showLeagueBadge
        ? '<div class="match-league-badge">' +
            '<span>' + match.league.name + (match.league.country ? ' <span class="league-country-sm">(' + match.league.country + ')</span>' : '') + '</span>' +
            statusBadgeHtml +
          '</div>'
        : '<div class="match-top-bar">' + statusBadgeHtml + '</div>';

      return '<div class="match-card" id="card-' + mid + '">' +
        leagueBadge +
        '<div class="match-info">' +
          '<div class="match-teams">' +
            homeLogo +
            '<span class="team-name home">' + homeName + '</span>' +
            scoreHtml +
            '<span class="team-name away">' + awayName + '</span>' +
            awayLogo +
          '</div>' +
          '<div class="match-meta">' +
            '<span class="match-datetime">' + dateStr + ' ' + timeStr + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="match-primary-odds">' + primaryHtml + '</div>' +
        (hasExpandedMarkets ? (
          '<button class="match-expand-btn" onclick="toggleExpand(\'' + mid + '\')">' +
            '<span class="arrow">&#9660;</span> <span id="expandLabel-' + mid + '">' + tm("moreMarkets") + '</span>' +
          '</button>' +
          '<div class="match-expanded" id="expanded-' + mid + '"></div>'
        ) : '') +
      '</div>';
    }

    // ── BUILD EXPANDED MARKETS ──
    function buildExpandedMarkets(match, bets, mid, disabled, isLive) {
      const tabs = [];
      const panels = [];

      if (isLive) {
        // Live: auto-categorize by bet NAME (live API uses different IDs than pre-match)
        const catMap = { result: [], goals: [], handicap: [], corners: [], cards: [], odd_even: [] };
        bets.forEach(bet => {
          const cat = categorizeLiveBet(bet.name);
          if (!catMap[cat]) return; // skip unsettleable categories (players)
          // Skip card/corner bets with count-based values (0,1,2,more 5) — can't settle these
          if ((cat === "cards" || cat === "corners") && bet.values && bet.values.length > 0) {
            const hasOU = bet.values.some(v => /^(Over|Under)\b/i.test(v.value));
            const hasResult = bet.values.some(v => /^(Home|Away|Draw)\b/i.test(v.value));
            if (!hasOU && !hasResult) return; // pure count values — skip
          }
          catMap[cat].push(bet);
        });
        const LIVE_CAT_ORDER = ["result", "goals", "handicap", "corners", "cards", "odd_even"];
        LIVE_CAT_ORDER.forEach(catId => {
          const catBets = catMap[catId];
          if (!catBets || catBets.length === 0) return;
          let html = '';
          catBets.forEach(bet => {
            html += renderBetBlock(bet, match, mid, disabled, true);
          });
          tabs.push({ id: catId, label: tm(catId) });
          panels.push({ id: catId, html: html });
        });
      } else {
        // Pre-match: group by BET_CATEGORIES config (Bet365 IDs)
        BET_CATEGORIES.forEach(cat => {
          const catBets = bets.filter(b => cat.betIds.includes(b.id));
          if (catBets.length === 0) return;
          let html = '';
          catBets.forEach(bet => {
            html += renderBetBlock(bet, match, mid, disabled, false);
          });
          tabs.push({ id: cat.id, label: tm(cat.id) });
          panels.push({ id: cat.id, html: html });
        });
      }

      if (tabs.length === 0) return '';

      let html = '<div class="market-tabs">';
      tabs.forEach((tab, i) => {
        html += '<button class="market-tab ' + (i === 0 ? 'active' : '') + '" onclick="switchMarketTab(\'' + mid + '\',\'' + tab.id + '\')">' + tab.label + '</button>';
      });
      html += '</div>';

      panels.forEach((p, i) => {
        html += '<div class="market-panel ' + (i === 0 ? 'show' : '') + '" id="panel-' + mid + '-' + p.id + '">' + p.html + '</div>';
      });

      return html;
    }

    // ── Auto-categorize live bet by name ──
    // Returns null for unsettleable bets (filtered out from live view)
    function categorizeLiveBet(name) {
      const n = name.toLowerCase();
      // Player props — can't settle (no per-player stats from API)
      if (n.includes("scorer") || n.includes("assist") || n.includes("foul") || n.includes("player")) return null;
      if (n.includes("corner")) return "corners";
      if (n.includes("card")) return "cards";
      if (n.includes("odd") || n.includes("even")) return "odd_even";
      if (n.includes("handicap")) return "handicap";
      if (n.includes("goal") || n.includes("score") || n.includes("over/under") || n.includes("both teams")) return "goals";
      return "result";
    }
