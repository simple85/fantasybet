<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-container">
      <div class="login-card">
        <h2 id="loginTitle">Giris Yap</h2>

        <div class="form-group">
          <label id="labelUser">KULLANICI ADI</label>
          <input type="text" id="userId" placeholder="" autocomplete="off">
        </div>

        <div class="form-group">
          <label id="labelPass">SIFRE</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="">
            <button type="button" class="password-toggle" id="passwordToggle" onclick="togglePasswordVisibility()">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()">GIRIS</button>

        <div class="login-error" id="loginError"></div>
      </div>

      <div class="login-lang">
        <button onclick="switchLang('tr')" id="langTr">TR</button>
        <button onclick="switchLang('en')" id="langEn">EN</button>
        <button onclick="switchLang('de')" id="langDe">DE</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    // Check if already logged in
    const currentUser = localStorage.getItem("betzone_user");
    if (currentUser) {
      window.location.href = "app.html";
    }

    // Initialize language
    updateLoginLang();

    // Enter key support
    document.getElementById("password").addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleLogin();
    });
    document.getElementById("userId").addEventListener("keypress", (e) => {
      if (e.key === "Enter") document.getElementById("password").focus();
    });

    function togglePasswordVisibility() {
      const input = document.getElementById("password");
      const eyeIcon = document.getElementById("eyeIcon");
      const eyeOffIcon = document.getElementById("eyeOffIcon");
      if (input.type === "password") {
        input.type = "text";
        eyeIcon.style.display = "none";
        eyeOffIcon.style.display = "block";
      } else {
        input.type = "password";
        eyeIcon.style.display = "block";
        eyeOffIcon.style.display = "none";
      }
    }

    async function handleLogin() {
      const userId = document.getElementById("userId").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("loginError");

      if (!userId || !password) {
        errorEl.textContent = t("loginError");
        errorEl.classList.add("show");
        setTimeout(() => errorEl.classList.remove("show"), 3000);
        return;
      }

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: userId, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem("betzone_user", JSON.stringify(data.user));
          window.location.href = "app.html";
        } else {
          errorEl.textContent = t("loginError");
          errorEl.classList.add("show");
          setTimeout(() => errorEl.classList.remove("show"), 3000);
        }
      } catch (e) {
        errorEl.textContent = t("loginError");
        errorEl.classList.add("show");
        setTimeout(() => errorEl.classList.remove("show"), 3000);
      }
    }

    function switchLang(lang) {
      localStorage.setItem("betzone_lang", lang);
      updateLoginLang();
    }

    function updateLoginLang() {
      const lang = getCurrentLang();
      document.getElementById("loginTitle").textContent = t("loginTitle");
      document.getElementById("labelUser").textContent = t("userId").toLocaleUpperCase(lang);
      document.getElementById("labelPass").textContent = t("password").toLocaleUpperCase(lang);
      document.getElementById("loginBtn").textContent = t("loginBtn").toLocaleUpperCase(lang);
      document.querySelectorAll(".login-lang button").forEach(btn => {
        btn.classList.toggle("active", btn.textContent.trim().toLowerCase() === lang);
      });
    }
  </script>
</body>
</html>
